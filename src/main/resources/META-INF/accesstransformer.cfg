# LightningBolt#life is the tick counter its two thunder sounds are keyed off: they play, client
# side, on the one tick it reads 2, at volumes that are hardcoded in the method. Widening the field
# is what lets VanillaLightningBoltEntity step past that tick and play its own pair at its own
# volume, without touching anything else vanilla's tick does.
public net.minecraft.world.entity.LightningBolt life

# Guardian#setActiveAttackTarget is the whole of the beam: it is what the renderer reads to draw the
# ray, and it is package private, so a Guardian subclass in another package cannot start one. The
# Compressed Guardian needs it because it replaces vanilla's attack goal outright - vanilla's damage
# figures are hardcoded inside that goal, and it lands them as two hits in one tick, which the
# invulnerability window would throw most of away.
public net.minecraft.world.entity.monster.Guardian setActiveAttackTarget(I)V

# Wolf#setCollarColor is private, and the collar is one of the two things (with the variant) that
# make a particular wolf recognisably somebody's pet. The Compressed Bone replaces the wolf it is
# fed to with a Compressed Wolf, so it has to be able to carry the collar across - otherwise every
# tamed wolf in the game comes back red.
public net.minecraft.world.entity.animal.Wolf setCollarColor(Lnet/minecraft/world/item/DyeColor;)V

# Horse#setVariantAndMarkings is private, and the coat and its markings are what make one horse
# recognisably the horse a player tamed. The Compressed Saddle replaces the horse it is used on with
# a Compressed Horse, so it has to carry both across - the public setVariant keeps the *new* horse's
# markings bits, so it alone would repaint every markings pattern in the game to whatever the fresh
# entity happened to start with.
public net.minecraft.world.entity.animal.horse.Horse setVariantAndMarkings(Lnet/minecraft/world/entity/animal/horse/Variant;Lnet/minecraft/world/entity/animal/horse/Markings;)V

# LivingEntity#attackStrengthTicker is what Player#getAttackStrengthScale reads, and it is protected
# with no setter - resetAttackStrengthTicker only ever puts it back to zero. A Scythe Wave is loosed
# at one moment and lands at another, and it has to land at the charge the swing had rather than at
# whatever has recharged in the meantime, so ScytheWaveEntity swaps the wielder's ticker for the
# saved one for the length of the Player#attack call and puts it straight back.
public net.minecraft.world.entity.LivingEntity attackStrengthTicker

# RangedAttribute#maxValue is the ceiling every attribute value is clamped to on the way in, and it
# is private final with no way to state a different one - so vanilla's 1024 on MAX_HEALTH silently
# turned this mod's 5000 point bosses into 1024 point ones, and nothing anywhere said so. Widening
# the field is what lets ModAttributeCeilings raise it at startup; see that class for why it is a
# ceiling raise rather than eleven mobs being renumbered.
public-f net.minecraft.world.entity.ai.attributes.RangedAttribute maxValue
